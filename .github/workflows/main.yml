name: GitHub Actions Demo

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  push:
  workflow_dispatch:
    inputs:
      budget:
        description: Requested agent budget
        required: true
        default: 25
        type: number
      approval_threshold:
        description: Budgets above this value require human approval
        required: true
        default: 25
        type: number

permissions:
  contents: read
  issues: write

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v6

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: List files in the repository
        run: ls "$GITHUB_WORKSPACE"

      - name: Evaluate requested budget
        id: budget
        env:
          REQUESTED_BUDGET: ${{ inputs.budget || vars.DEFAULT_AGENT_BUDGET || '0' }}
          APPROVAL_THRESHOLD: ${{ inputs.approval_threshold || vars.AGENT_APPROVAL_THRESHOLD || '25' }}
        run: |
          if ! jq --null-input --exit-status \
            --argjson budget "$REQUESTED_BUDGET" \
            --argjson threshold "$APPROVAL_THRESHOLD" \
            '$budget >= 0 and $threshold >= 0' > /dev/null; then
            echo "::error::The budget and approval threshold must be non-negative numbers."
            exit 1
          fi

          requires_approval="$(
            jq --null-input --raw-output \
              --argjson budget "$REQUESTED_BUDGET" \
              --argjson threshold "$APPROVAL_THRESHOLD" \
              '$budget > $threshold'
          )"

          echo "budget=$REQUESTED_BUDGET" >> "$GITHUB_OUTPUT"
          echo "threshold=$APPROVAL_THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "requires_approval=$requires_approval" >> "$GITHUB_OUTPUT"

      - name: Wait for manual approval
        if: ${{ steps.budget.outputs.requires_approval == 'true' }}
        uses: trstringer/manual-approval@v1
        timeout-minutes: 60
        with:
          secret: ${{ github.token }}
          # Replace app1 with one or more comma-separated GitHub usernames.
          approvers: app1
          minimum-approvals: 1
          issue-title: "Approve agent budget ${{ steps.budget.outputs.budget }}"
          issue-body: |
            Please approve or deny this agent run.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Requested budget: ${{ steps.budget.outputs.budget }}
            Automatic approval threshold: ${{ steps.budget.outputs.threshold }}
          exclude-workflow-initiator-as-approver: false
          fail-on-denial: true
          additional-approved-words: ""
          additional-denied-words: ""
          polling-interval-seconds: 10

      - name: Continue after budget approval
        run: |
          if [[ "${{ steps.budget.outputs.requires_approval }}" == "true" ]]; then
